services:
  - type: web
    name: ghv-cost-manage
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ghv-cost-db
          property: connectionString
      - key: ADMIN_PASSWORD
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

databases:
  - name: ghv-cost-db
    databaseName: ghvcost
    user: ghvcost
